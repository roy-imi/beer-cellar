<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">啤记明细操作图标规范</title>
  <desc id="desc">收藏、喝、编辑、更多、删除、恢复库存与展开收起图标，以及在明细记录中的组合示例。</desc>
  <defs>
    <style>
      .board-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f1f1f; }
      .board-muted { fill: #6b6251; }
      .board-icon { fill: none; stroke: #1f1f1f; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .board-danger { fill: none; stroke: #9a2f21; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .board-restore { fill: none; stroke: #246852; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="doc-heart" viewBox="0 0 24 24">
      <path class="board-icon" d="M20.8 4.8c-2-2-5.1-2-7.1 0L12 6.5l-1.7-1.7c-2-2-5.1-2-7.1 0s-2 5.2 0 7.2L12 20.5 20.8 12c2-2 2-5.2 0-7.2Z"/>
    </symbol>
    <symbol id="doc-heart-filled" viewBox="0 0 24 24">
      <path fill="#1f1f1f" d="M20.8 4.8c-2-2-5.1-2-7.1 0L12 6.5l-1.7-1.7c-2-2-5.1-2-7.1 0s-2 5.2 0 7.2L12 20.5 20.8 12c2-2 2-5.2 0-7.2Z"/>
    </symbol>
    <symbol id="doc-edit" viewBox="0 0 24 24">
      <path class="board-icon" d="M4 20h4.2L19.4 8.8a2.1 2.1 0 0 0 0-3L18.2 4.6a2.1 2.1 0 0 0-3 0L4 15.8V20Z"/>
      <path class="board-icon" d="m13.8 6 4.2 4.2M4.8 15.3l3.9 3.9"/>
    </symbol>
    <symbol id="doc-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.8" fill="#1f1f1f"/><circle cx="12" cy="12" r="1.8" fill="#1f1f1f"/><circle cx="19" cy="12" r="1.8" fill="#1f1f1f"/>
    </symbol>
    <symbol id="doc-trash" viewBox="0 0 24 24">
      <path class="board-danger" d="M4.5 7h15M9 4h6l1 3H8l1-3ZM7 7l.7 13h8.6L17 7M10 10.5v6M14 10.5v6"/>
    </symbol>
    <symbol id="doc-restore" viewBox="0 0 24 24">
      <path class="board-restore" d="M5.2 8.2A8 8 0 1 1 4.4 15M4.8 3.8v4.8h4.8M12 8.5v7M8.5 12h7"/>
    </symbol>
    <symbol id="doc-chevron-down" viewBox="0 0 24 24"><path class="board-icon" stroke-width="2.5" d="m6.5 9 5.5 5.5L17.5 9"/></symbol>
    <symbol id="doc-chevron-up" viewBox="0 0 24 24"><path class="board-icon" stroke-width="2.5" d="m6.5 15 5.5-5.5 5.5 5.5"/></symbol>
  </defs>

  <rect width="960" height="560" rx="30" fill="#f7f2e8"/>
  <rect x="26" y="26" width="908" height="508" rx="24" fill="#fffdf8" stroke="#1f1f1f" stroke-width="3"/>
  <text x="54" y="72" class="board-text" font-size="28" font-weight="900">啤记 · 明细操作图标规范</text>
  <text x="906" y="70" class="board-text board-muted" font-size="14" font-weight="700" text-anchor="end">圆角按钮 · 统一线宽 · 小尺寸优先</text>

  <g transform="translate(54 100)">
    <g>
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="48" y="18" width="44" height="44" rx="10" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <use href="#doc-heart" x="58" y="28" width="24" height="24"/>
      <rect x="106" y="18" width="44" height="44" rx="10" fill="#ffc000" stroke="#1f1f1f" stroke-width="2"/>
      <use href="#doc-heart-filled" x="116" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">收藏 / 已收藏</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">状态只改变填充</text>
    </g>
    <g transform="translate(214)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="77" y="18" width="44" height="44" rx="10" fill="#e4f3d6" stroke="#a8cf87" stroke-width="2"/>
      <text x="99" y="48" class="board-text" fill="#38621d" font-size="20" font-weight="900" text-anchor="middle">喝</text>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">喝掉一瓶</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">单字适配小按钮</text>
    </g>
    <g transform="translate(428)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="77" y="18" width="44" height="44" rx="10" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <use href="#doc-edit" x="87" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">编辑</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">标准铅笔语义</text>
    </g>
    <g transform="translate(642)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="77" y="18" width="44" height="44" rx="10" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <use href="#doc-more" x="87" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">更多</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">横向省略号</text>
    </g>

    <g transform="translate(0 132)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="77" y="18" width="44" height="44" rx="10" fill="#ffe0da" stroke="#efb7ad" stroke-width="2"/>
      <use href="#doc-trash" x="87" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">删除</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">垃圾桶 + 危险色</text>
    </g>
    <g transform="translate(214 132)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="77" y="18" width="44" height="44" rx="10" fill="#dff4ee" stroke="#a8d7ca" stroke-width="2"/>
      <use href="#doc-restore" x="87" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">恢复库存</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">回转箭头 + 加号</text>
    </g>
    <g transform="translate(428 132)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <rect x="48" y="18" width="44" height="44" rx="10" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <use href="#doc-chevron-down" x="58" y="28" width="24" height="24"/>
      <rect x="106" y="18" width="44" height="44" rx="10" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <use href="#doc-chevron-up" x="116" y="28" width="24" height="24"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">展开 / 收起</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">统一方向箭头</text>
    </g>
    <g transform="translate(642 132)">
      <rect width="198" height="116" rx="16" fill="#fffaf0" stroke="#eee2c7" stroke-width="2"/>
      <circle cx="68" cy="40" r="14" fill="#fff" stroke="#ded2b5" stroke-width="2"/>
      <circle cx="99" cy="40" r="14" fill="#e4f3d6" stroke="#a8cf87" stroke-width="2"/>
      <circle cx="130" cy="40" r="14" fill="#ffe0da" stroke="#efb7ad" stroke-width="2"/>
      <text x="99" y="84" class="board-text" font-size="16" font-weight="900" text-anchor="middle">状态色规则</text>
      <text x="99" y="104" class="board-text board-muted" font-size="12" text-anchor="middle">中性 / 正向 / 危险</text>
    </g>
  </g>

  <text x="54" y="388" class="board-text" font-size="18" font-weight="900">明细内组合示例</text>
  <rect x="54" y="404" width="852" height="96" rx="14" fill="#fffdf8" stroke="#ded2b5" stroke-width="2"/>
  <text x="76" y="438" class="board-text" font-size="18" font-weight="900">2026-08-24 · 喜力经典</text>
  <text x="76" y="466" class="board-text board-muted" font-size="14">剩余 2 · 新鲜</text>
  <g transform="translate(704 426)">
    <rect width="42" height="42" rx="9" fill="#fff" stroke="#ded2b5" stroke-width="2"/><use href="#doc-heart" x="9" y="9" width="24" height="24"/>
    <rect x="50" width="42" height="42" rx="9" fill="#e4f3d6" stroke="#a8cf87" stroke-width="2"/><text x="71" y="28" class="board-text" fill="#38621d" font-size="19" font-weight="900" text-anchor="middle">喝</text>
    <rect x="100" width="42" height="42" rx="9" fill="#fff" stroke="#ded2b5" stroke-width="2"/><use href="#doc-edit" x="109" y="9" width="24" height="24"/>
  </g>
</svg>
